name: Development Image
on:
  push:
    branches: [main]
    paths:
      - 'a13n_claw/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'deploy/docker/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hatch_build.py'
      - '.dockerignore'
      - 'README.md'
      - 'LICENSE'
      - 'Makefile'
      - '.github/workflows/images.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-image
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Resolve and pin latest compatible Service once
        id: service
        shell: bash
        run: |
          make image-requirements IMAGE_MODE=latest
          echo "version=$(python -c 'import json; print(json.load(open("build/service-selection.json"))["version"])')" >> "$GITHUB_OUTPUT"
          echo "image=$(python -c 'import json; print(json.load(open("build/service-selection.json"))["image"])')" >> "$GITHUB_OUTPUT"
      - name: Build Console against selected Service SDK
        env:
          SERVICE_VERSION: ${{ steps.service.outputs.version }}
        run: |
          pnpm --dir frontend install --frozen-lockfile
          uv run --no-project --with "a13n-service==$SERVICE_VERSION" python -m a13n_service.console_sdk frontend/.console-sdk/index.d.ts
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
          pnpm --dir frontend build
          uv build --clear
          uv run --locked python scripts/check_artifacts.py --service-version "$SERVICE_VERSION"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/wh1isper/a13n-claw:dev
          build-args: |
            SERVICE_VERSION=${{ steps.service.outputs.version }}
            SERVICE_IMAGE=${{ steps.service.outputs.image }}
