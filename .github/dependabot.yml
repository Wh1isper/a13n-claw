version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # Service 0.5.0's SQLAlchemy typing and Harness 0.41.0's runtime require these ranges.
    ignore:
      - dependency-name: sqlalchemy
        versions: [">=2.1"]
      - dependency-name: websockets
        versions: [">=16"]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docs:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      frontend:
        patterns: ["*"]
