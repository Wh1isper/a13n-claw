version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docs:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      console:
        patterns: ["*"]
