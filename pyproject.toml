[project]
name = "a13n-claw"
version = "0.0.0"
description = "IM-first assistant and headless service embedding Harness UI"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Wh1isper"}]
requires-python = ">=3.13"
dependencies = [
  "a13n-harness>=0.13.0,<0.14.0",
  "a13n-harness-ui>=0.13.0,<0.14.0",
  "lark-oapi>=1.7.5,<2",
  "alembic[tz]>=1.20.0,<2",
  "sqlalchemy>=2.0.41,<3",
  "fastapi>=0.146.0,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.14.1,<3",
  "pydantic-ai>=2.55.0,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.34,<1",
  "websockets>=15,<16",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://a13n-claw.wh1isper.top"
Repository = "https://github.com/Wh1isper/a13n-claw"
Documentation = "https://a13n-claw.wh1isper.top/docs/"
Issues = "https://github.com/Wh1isper/a13n-claw/issues"

[project.scripts]
a13n-claw = "a13n_claw.cli:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["a13n_claw"]

[tool.hatch.build.targets.sdist]
include = ["/a13n_claw", "/tests", "/scripts", "/pyproject.toml", "/hatch_build.py", "/console", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
  "deptry>=0.24,<1",
  "mdformat>=1.0.0,<2",
  "mdformat-frontmatter>=2,<3",
  "mdformat-gfm>=0.4,<2",
  "pre-commit>=4,<5",
  "pyright>=1.1,<2",
  "pytest>=9,<10",
  "ruff>=0.17.0,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["a13n_claw", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.deptry]
known_first_party = ["a13n_claw"]
