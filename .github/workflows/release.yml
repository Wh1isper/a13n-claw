name: Release
on:
  push:
    tags: ["release/a13n-claw-v*"]
permissions:
  contents: read
concurrency:
  group: release-a13n-claw
  cancel-in-progress: false
jobs:
  build:
    name: Prepare release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      python-version: ${{ steps.version.outputs.python-version }}
      service-version: ${{ steps.service.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful main-branch CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          for workflow in ci.yml site.yml; do
            count=$(gh run list --workflow "$workflow" --branch main --commit "$(git rev-parse HEAD)" --status success --json databaseId --jq length)
            test "$count" -gt 0 || { echo "No successful $workflow for tagged commit"; exit 1; }
          done
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Resolve locked Service
        id: service
        shell: bash
        run: |
          make image-requirements
          echo "version=$(python -c 'import json; print(json.load(open("build/service-selection.json"))["version"])')" >> "$GITHUB_OUTPUT"
          uv run --locked python scripts/check_artifacts.py --base-image-only
      - run: make console-build
      - name: Inject release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/a13n-claw-v}"
          uv run --locked python scripts/prepare_release.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "python-version=${version/-rc./rc}" >> "$GITHUB_OUTPUT"
      - run: uv build --clear
      - name: Verify the versioned wheel and source distribution
        run: .venv/bin/python scripts/check_artifacts.py --service-version '${{ steps.service.outputs.version }}'
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
  publish-python:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: astral-sh/setup-uv@v7
      - name: Publish distributions
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*
  publish-image:
    name: Publish container
    needs: [build, publish-python]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Resolve locked image
        id: service
        shell: bash
        run: |
          make image-requirements
          echo "version=$(python -c 'import json; print(json.load(open("build/service-selection.json"))["version"])')" >> "$GITHUB_OUTPUT"
          echo "image=$(python -c 'import json; print(json.load(open("build/service-selection.json"))["image"])')" >> "$GITHUB_OUTPUT"
          test "${{ needs.build.outputs.service-version }}" = "$(python -c 'import json; print(json.load(open("build/service-selection.json"))["version"])')"
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/wh1isper/a13n-claw
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.build.outputs.version, '-rc.') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.build.outputs.python-version }}
            SERVICE_VERSION=${{ steps.service.outputs.version }}
            SERVICE_IMAGE=${{ steps.service.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  github-release:
    name: Create GitHub Release
    needs: [build, publish-python, publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Create release after all publication channels complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          # List failure is fatal; do not mistake an authorization error for absence.
          existing=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if printf '%s\n' "$existing" | grep -Fxq "$GITHUB_REF_NAME"; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          args=()
          if [[ "$VERSION" == *-rc.* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "a13n Claw $VERSION" "${args[@]}"
