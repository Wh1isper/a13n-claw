[project]
name = "a13n-claw"
version = "0.0.0"
description = "Placeholder for a local-first agent runtime built on a13n Harness"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Wh1isper"}]
requires-python = ">=3.13"
dependencies = []
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://a13n-claw.wh1isper.top"
Repository = "https://github.com/Wh1isper/a13n-claw"
Documentation = "https://a13n-claw.wh1isper.top/docs/"
Issues = "https://github.com/Wh1isper/a13n-claw/issues"

[project.scripts]
a13n-claw = "a13n_claw.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a13n_claw"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
dev = [
  "deptry>=0.24,<1",
  "mdformat>=0.7,<1",
  "mdformat-frontmatter>=2,<3",
  "mdformat-gfm>=0.4,<1",
  "pre-commit>=4,<5",
  "pyright>=1.1,<2",
  "pytest>=9,<10",
  "ruff>=0.16,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.deptry]
known_first_party = ["a13n_claw"]
